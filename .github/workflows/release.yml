name: macOS Release
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'apps/macos/**'
      - 'backend/**'
      - 'VERSION'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: Universal release package
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, nebula-gui-ci]
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/nebula-gui
    env:
      GOTOOLCHAIN: local
      GOWORK: off
      CI_JOB_ROOT: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      NEBULA_GUI_APP_OUTPUT: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/nebula-gui/build/ReleaseTests/Nebula.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/nebula-gui
          persist-credentials: false
      - name: Validate tag before building
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          VERSION="$(cat VERSION)"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc[1-9][0-9]*)?$ ]]
          if [[ "$RELEASE_EVENT" == push ]]; then
            [[ "$RELEASE_REF" == "v$VERSION" ]]
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/nebula-gui/backend/go.mod
          cache: false
      - name: Fetch reviewed kernel
        run: bash scripts/prepare-kernel.sh
      - name: Test tag or manual candidate
        if: github.event_name != 'pull_request'
        run: |
          bash scripts/test.sh
          (cd backend && go vet ./...)
      - name: Build and verify Universal archives
        id: archives
        run: |
          bash scripts/package-release.sh
          python3 scripts/test-release.py
          echo "directory=$CI_JOB_ROOT/nebula-gui/build/Release/v$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: ${{ steps.archives.outputs.directory }}
          if-no-files-found: error
          retention-days: 7
      - name: Remove job workspace
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          EXPECTED="$GITHUB_WORKSPACE/ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          [ "$CI_JOB_ROOT" = "$EXPECTED" ]
          rm -rf -- "$CI_JOB_ROOT"
  integrity:
    name: Release artifact integrity
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-release
          path: assets
      - name: Verify downloaded assets
        working-directory: assets
        run: sha256sum --check SHA256SUMS
  draft:
    name: Attach assets to draft release
    needs: integrity
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-release
          path: assets
      # Software update signature (#69): only this tag job reads the signing secret.
      - name: Sign update archive
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.NEBULA_UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum --check SHA256SUMS
          PUBLIC_KEY="$(jq -r '.updatePublicKey // ""' build-info.json)"
          if [ -z "$PUBLIC_KEY" ]; then
            echo '::warning::No update public key in this build; the release cannot be installed automatically.'
            exit 0
          fi
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo 'NEBULA_UPDATE_SIGNING_KEY is not configured' >&2; exit 1; }
          umask 077
          KEY="$RUNNER_TEMP/update-key.pem"
          trap 'rm -f "$KEY" "$RUNNER_TEMP/update.sig" "$RUNNER_TEMP/update-public.pem"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$KEY"
          [ "$(openssl pkey -in "$KEY" -pubout -outform DER | tail -c 32 | base64 -w0)" = "$PUBLIC_KEY" ] || {
            echo 'Signing key does not match the public key embedded in the App' >&2
            exit 1
          }
          ARCHIVE="Nebula-$RELEASE_TAG-macos-universal.zip"
          openssl pkeyutl -sign -inkey "$KEY" -rawin -in "$ARCHIVE" -out "$RUNNER_TEMP/update.sig"
          openssl pkey -in "$KEY" -pubout -out "$RUNNER_TEMP/update-public.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/update-public.pem" -rawin -in "$ARCHIVE" -sigfile "$RUNNER_TEMP/update.sig"
          base64 -w0 "$RUNNER_TEMP/update.sig" > "$ARCHIVE.sig"
      - name: Create or update draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            jq -e '.isDraft == true' release-state.json > /dev/null || {
              echo 'Refusing to overwrite a published release' >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "Nebula GUI $RELEASE_TAG (internal validation)" --notes-file release-notes.md
          fi
          SIGNATURE=()
          [ ! -f "Nebula-$RELEASE_TAG-macos-universal.zip.sig" ] || SIGNATURE=("Nebula-$RELEASE_TAG-macos-universal.zip.sig")
          gh release upload "$RELEASE_TAG" \
            "Nebula-$RELEASE_TAG-macos-universal.dmg" \
            "Nebula-$RELEASE_TAG-macos-universal.zip" \
            build-info.json release-notes.md SHA256SUMS "${SIGNATURE[@]}" --clobber
