name: macOS PR checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS build and tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, nebula-gui-ci]
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/nebula-gui
    env:
      GOTOOLCHAIN: local
      GOWORK: off
      CI_JOB_ROOT: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      NEBULA_GUI_APP_OUTPUT: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/nebula-gui/build/CI/Nebula.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/nebula-gui
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/nebula-gui/backend/go.mod
          cache: false
      - name: Record toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          go version
      - name: Fetch reviewed kernel
        run: bash scripts/prepare-kernel.sh
      - name: Build and test
        run: bash scripts/test.sh
      - name: Isolated native UI previews
        run: |
          bash scripts/preview-ui.sh --build-only
          .build/bin/nebula-ui-preview --verify-isolation
          .build/bin/nebula-ui-preview --scenario empty --width 760 --snapshot build/CI/empty.png
          .build/bin/nebula-ui-preview --scenario connected --page nodes --width 760 --snapshot build/CI/nodes.png
          .build/bin/nebula-ui-preview --scenario connected --page configuration --width 760 --height 1500 --snapshot build/CI/configuration.png
          .build/bin/nebula-ui-preview --scenario connected --page logs --width 760 --snapshot build/CI/logs.png
          .build/bin/nebula-ui-preview --scenario connected --page logs --appearance dark --snapshot build/CI/logs-dark.png
          .build/bin/nebula-ui-preview --scenario logs-upgrade --page logs --width 760 --snapshot build/CI/logs-upgrade.png
          .build/bin/nebula-ui-preview --scenario monitor --page nodes --width 760 --height 1500 --snapshot build/CI/monitor.png
          .build/bin/nebula-ui-preview --scenario update --page configuration --width 760 --height 1500 --snapshot build/CI/update.png
          .build/bin/nebula-ui-preview --scenario monitor --page nodes --appearance dark --snapshot build/CI/monitor-dark.png
          .build/bin/nebula-ui-preview --scenario unavailable --menu --appearance dark --snapshot build/CI/menu-dark.png
          .build/bin/nebula-ui-preview --scenario monitor --menu --height 860 --snapshot build/CI/menu-monitor.png
          .build/bin/nebula-ui-preview --scenario monitor --menu --height 860 --appearance dark --snapshot build/CI/menu-monitor-dark.png
      # Synthetic preview data only: no credentials, real addresses or backend calls.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-previews
          path: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/nebula-gui/build/CI/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Go vet
        working-directory: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/nebula-gui/backend
        run: go vet ./...
      - name: Whitespace check
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$CHECK_BASE" =~ ^[0-9a-f]{40}$ ]] && [[ "$CHECK_BASE" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$CHECK_BASE" HEAD
          else
            git show --check --oneline HEAD
          fi
      - name: Remove job workspace
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          EXPECTED="$GITHUB_WORKSPACE/ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          [ "$CI_JOB_ROOT" = "$EXPECTED" ]
          rm -rf -- "$CI_JOB_ROOT"
